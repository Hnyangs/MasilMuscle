name: Keep Supabase alive

# 무료 플랜 프로젝트의 일시 중지를 막기 위해 매일 09:00 KST(= 00:00 UTC)에 가벼운 GET 요청을 보냅니다.
# 저장소 Settings > Secrets and variables > Actions 에 SUPABASE_URL, SUPABASE_ANON_KEY를 등록하세요.
# (스케줄 워크플로는 기본 브랜치에 있어야 실행됩니다)
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set"; exit 1
          fi
          curl -fsS --retry 3 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1" -o /dev/null -w "HTTP %{http_code}\n"
