<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4f46e5">
<title>ㅁㅅ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#4f46e5;--pl:#eef2ff;--bg:#f5f6fa;--t:#111827;--m:#6b7280;--b:#e5e7eb}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);max-width:480px;margin:0 auto;min-height:100vh}
.screen{padding:16px 16px 100px}
h2{font-size:21px}.title{margin:8px 0 14px}h3{font-size:16px;margin-bottom:8px}.sec{margin:20px 4px 10px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.slim{padding:12px 14px;cursor:pointer}.card.alert{background:var(--p);color:#fff;font-weight:600;cursor:pointer}
.card.new{border-left:4px solid var(--p)}
.muted{color:var(--m)}.small{font-size:13px}.center{text-align:center;padding:20px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:8px;flex-wrap:wrap}
.card .row+.row{margin-top:12px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--m);margin:16px 0 6px}.lbl:first-child{margin-top:0}
.input{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
.input:focus{outline:2px solid var(--p);border-color:transparent}.w-auto{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--b);background:#fff;font-size:15px;cursor:pointer;font-family:inherit;color:var(--t)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}.chip.add{border-style:dashed;color:var(--m)}
.chip.sm{padding:6px 11px;font-size:13px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer;background:#f3f4f6;font-family:inherit;color:var(--t)}
.btn.primary{background:var(--p);color:#fff}.btn.ghost{background:var(--pl);color:var(--p)}
.btn.sm{width:auto;display:inline-block;padding:9px 13px;font-size:14px;margin-top:8px}
.btn.danger{color:#dc2626}.btn.google{background:#fff;border:1px solid var(--b)}
.setrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sn{width:24px;height:24px;border-radius:50%;background:var(--pl);color:var(--p);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.num{text-align:center;padding:10px 4px}
.x{border:none;background:none;color:var(--m);font-size:14px;padding:6px;cursor:pointer}
.hint{background:#fffbeb;color:#92400e;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px}
.tag{display:inline-block;background:var(--pl);color:var(--p);font-size:12px;padding:3px 8px;border-radius:6px;font-weight:600;margin-right:4px}
.tags{margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:#fff;border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--m)}
.reclist{list-style:none}
.reclist li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--b);cursor:pointer}
.go{color:var(--p);font-weight:600;font-size:14px;white-space:nowrap}
.mini{border:1px solid var(--b);border-radius:8px;padding:5px;font-size:13px;background:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--b);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:10px 0 8px;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-family:inherit;cursor:pointer}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--p);font-weight:700}
.badge{position:absolute;top:4px;right:calc(50% - 20px);background:#ef4444;color:#fff;font-size:10px;border-radius:999px;padding:1px 5px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
.login{padding:60px 24px;text-align:center}.logo{font-size:56px}.login h1{margin:8px 0}.login .input{margin-top:12px}
.divider{margin:28px 0 4px;color:var(--m);font-size:13px}
.seg{display:flex;gap:8px;margin-top:10px}.seg label{flex:1;padding:12px;border:1px solid var(--b);border-radius:10px;background:#fff}
.fb{margin:10px 0;line-height:1.6}.hw{background:var(--bg);padding:10px;border-radius:8px;font-size:14px}
details{margin-top:10px;font-size:14px}summary{color:var(--p);cursor:pointer;margin-bottom:6px}
.spark{width:100%;height:60px;margin-top:4px}.metric{margin-bottom:16px}
.toggle{width:22px;height:22px;accent-color:var(--p)}
.up{color:#dc2626}.down{color:#2563eb}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ===== 기본 데이터 ===== */
const PARTS=['가슴','등','하체','어깨','팔','복근'];
const DEFAULT_EX={
  가슴:['벤치프레스','인클라인 덤벨프레스','체스트 프레스 머신','펙덱 플라이','딥스'],
  등:['랫풀다운','바벨로우','시티드 케이블로우','풀업','데드리프트'],
  하체:['스쿼트','레그프레스','레그 익스텐션','레그컬','루마니안 데드리프트'],
  어깨:['오버헤드프레스','사이드 레터럴 레이즈','리어델트 플라이','페이스풀'],
  팔:['바벨컬','케이블 푸시다운','해머컬','오버헤드 익스텐션'],
  복근:['크런치','행잉 레그레이즈','플랭크']
};
const SPLIT_LIST=[['auto','자동 추천'],['2','2분할'],['3','3분할'],['4','4분할'],['full','무분할']];
const SPLIT_NAME=Object.fromEntries(SPLIT_LIST);
const SPLITS={
  '2':{desc:'상체 / 하체 번갈아',days:[{label:'상체',parts:['가슴','등','어깨','팔']},{label:'하체',parts:['하체','복근']}]},
  '3':{desc:'가슴+삼두 / 등+이두 / 하체+어깨',days:[{label:'가슴+삼두',parts:['가슴','팔']},{label:'등+이두',parts:['등','팔']},{label:'하체+어깨',parts:['하체','어깨']}]},
  '4':{desc:'가슴 / 등 / 하체 / 어깨+팔',days:[{label:'가슴',parts:['가슴']},{label:'등',parts:['등']},{label:'하체',parts:['하체','복근']},{label:'어깨+팔',parts:['어깨','팔']}]},
  'full':{desc:'매번 전신을 골고루',days:[{label:'전신',parts:['하체','가슴','등','어깨']}]}
};
const SPLIT_DESC={auto:'기록을 분석해서 가장 오래 쉰 부위를 추천해요',...Object.fromEntries(Object.entries(SPLITS).map(([k,v])=>[k,v.desc]))};

/* ===== 상태 ===== */
const KEY='fitlog-v1';
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const localDate=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const todayStr=()=>localDate(new Date());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byDate=(a,b)=>a.date.localeCompare(b.date);
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{user:null,settings:{split:'auto',notify:false,notifyTime:'19:00',notifyDays:[1,3,5],ptNotify:true,scriptUrl:'',token:''},workouts:[],pt:[],inbody:[],customEx:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
let tab='home';
let draft={date:todayStr(),part:null,exercise:null,sets:[]};

/* ===== 유틸 ===== */
function fmtDate(d){const [,m,dd]=d.split('-');return `${+m}월 ${+dd}일 (${'일월화수목금토'[new Date(d+'T00:00').getDay()]})`}
function daysSince(d){return Math.round((new Date(todayStr()+'T00:00')-new Date(d+'T00:00'))/864e5)}
function exercisesOf(p){return [...DEFAULT_EX[p],...(S.customEx[p]||[])]}
function lastTrained(p){const ds=S.workouts.filter(w=>w.part===p).map(w=>w.date).sort();return ds.at(-1)||null}
function restDays(p){const l=lastTrained(p);return l?daysSince(l):999}
function fmtRest(d){return d>=999?'기록 없음':d===0?'오늘 함':`${d}일 쉼`}
function lastRec(ex){return S.workouts.filter(w=>w.exercise===ex).sort(byDate).at(-1)}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
const unreadPT=()=>S.user?.role==='member'?S.pt.filter(p=>!p.read).length:0;

/* ===== 추천 로직 ===== */
function suggest(ex){
  const last=lastRec(ex);
  if(!last)return{text:'첫 기록이에요! 가벼운 무게로 자세부터 잡아요',w:'',r:10};
  const top=last.sets.reduce((a,s)=>+s.w>+a.w?s:a,last.sets[0]);
  let w=+top.w,msg;
  if(last.sets.every(s=>+s.r>=12)){w=Math.round((w+(w>=40?2.5:w>0?1:0))*10)/10;msg=`모든 세트 12회 이상 → ${w}kg 증량 도전!`}
  else if(last.sets.some(s=>+s.r<6))msg='횟수가 낮았어요 → 무게 유지';
  else msg='같은 무게로 횟수 늘리기';
  return{text:`지난번 ${top.w}kg×${top.r}회 · ${msg}`,w,r:top.r};
}
function topExercises(p,n){
  const cnt={};S.workouts.filter(w=>w.part===p).forEach(w=>cnt[w.exercise]=(cnt[w.exercise]||0)+1);
  return [...new Set([...Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),...exercisesOf(p)])].slice(0,n);
}
function recommend(){
  const mode=S.settings.split;let label,parts,reason;
  if(mode==='auto'){
    const main=['가슴','등','하체','어깨'].map(p=>({p,d:restDays(p)})).sort((a,b)=>b.d-a.d);
    parts=main.slice(0,2).map(x=>x.p);label='오늘의 자동 추천';
    reason=main.slice(0,2).map(x=>`${x.p} ${fmtRest(x.d)}`).join(' · ')+' → 가장 오래 쉰 부위예요';
  }else{
    const pick=SPLITS[mode].days.map(d=>({...d,rest:restDays(d.parts[0])})).reduce((a,b)=>b.rest>a.rest?b:a);
    parts=pick.parts;label=`${SPLIT_NAME[mode]} · ${pick.label} 데이`;
    reason=mode==='full'?(pick.rest<1?'오늘 이미 전신 운동을 했어요. 충분히 쉬어주세요!':`마지막 전신 운동 후 ${fmtRest(pick.rest)}`):`${pick.label} ${fmtRest(pick.rest)} → 오늘 차례예요`;
  }
  const per=Math.min(3,Math.max(1,Math.round(5/parts.length)));
  return{label,parts,reason,items:parts.flatMap(p=>topExercises(p,per).map(ex=>({part:p,ex,...suggest(ex)})))};
}

/* ===== 화면: 로그인 ===== */
function loginView(){return `<div class="login">
  <div class="logo">🏋️</div><h1>핏로그</h1><p class="muted">3번 탭하면 기록 끝.<br>구글 시트에 쌓이는 내 운동일지</p>
  <button class="btn google" onclick="toast('실서비스에서는 Google 로그인이 연결됩니다')">🔵 Google 계정으로 계속하기</button>
  <div class="divider">— 프로토타입 체험 —</div>
  <input id="lg-name" class="input" placeholder="이름 (예: 김민수)">
  <div class="seg"><label><input type="radio" name="role" value="member" checked> 회원</label><label><input type="radio" name="role" value="trainer"> 트레이너</label></div>
  <button class="btn primary" onclick="login()">시작하기</button></div>`}
function login(){
  const name=$('#lg-name').value.trim();if(!name)return toast('이름을 입력해주세요');
  S.user={name,role:document.querySelector('input[name=role]:checked').value};
  if(!S.workouts.length)seed();save();tab='home';render();
}

/* ===== 화면: 홈 ===== */
function homeView(){
  const rec=recommend(),t=todayStr();
  const week=new Set(S.workouts.filter(w=>daysSince(w.date)<7).map(w=>w.date)).size;
  const month=new Set(S.workouts.filter(w=>w.date.slice(0,7)===t.slice(0,7)).map(w=>w.date)).size;
  const ib=S.inbody.slice().sort(byDate).at(-1);const done=S.workouts.some(w=>w.date===t);const u=unreadPT();
  return `<div class="muted small">${fmtDate(t)}</div><h2>${esc(S.user.name)}님, ${done?'오늘도 해냈어요 🔥':'오늘 운동해볼까요?'}</h2>
  <div class="stats"><div><b>${week}</b><span>최근 7일</span></div><div><b>${month}</b><span>이번 달</span></div><div><b>${ib?ib.weight+'kg':'-'}</b><span>최근 체중</span></div></div>
  ${u?`<div class="card alert" onclick="go('pt')">📝 트레이너 피드백 ${u}건이 도착했어요 →</div>`:''}
  <div class="card"><div class="row between"><h3>🎯 ${esc(rec.label)}</h3>
    <select class="mini" onchange="setSplit(this.value)">${SPLIT_LIST.map(([k,v])=>`<option value="${k}" ${S.settings.split===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <p class="muted small">${esc(rec.reason)}</p>
    <div class="tags">${rec.parts.map(p=>`<span class="tag">${p}</span>`).join('')}</div>
    <ul class="reclist">${rec.items.map(it=>`<li data-p="${esc(it.part)}" data-e="${esc(it.ex)}" onclick="startEx(this.dataset.p,this.dataset.e)"><div><b>${esc(it.ex)}</b><div class="muted small">${esc(it.text)}</div></div><span class="go">기록 ›</span></li>`).join('')}</ul></div>
  <h3 class="sec">최근 기록</h3>${recentView()}`;
}
function recentView(){
  const dates=[...new Set(S.workouts.map(w=>w.date))].sort().reverse().slice(0,5);
  if(!dates.length)return '<p class="muted center">첫 운동을 기록해보세요!</p>';
  return dates.map(d=>{const ws=S.workouts.filter(w=>w.date===d);
    return `<div class="card slim" onclick="openDate('${d}')"><div class="row between"><b>${fmtDate(d)}</b><div>${[...new Set(ws.map(w=>w.part))].map(p=>`<span class="tag">${p}</span>`).join('')}</div></div>
    <div class="muted small" style="margin-top:6px">${ws.map(w=>`${esc(w.exercise)} · ${w.sets.length}세트 · 최고 ${Math.max(...w.sets.map(s=>s.w))}kg`).join('<br>')}</div></div>`}).join('');
}
function openDate(d){draft={date:d,part:null,exercise:null,sets:[]};go('record')}
function startEx(p,e){const sg=suggest(e);draft={date:todayStr(),part:p,exercise:e,sets:[0,1,2].map(()=>({w:sg.w,r:sg.r}))};go('record')}
function setSplit(v){S.settings.split=v;save();render()}

/* ===== 화면: 기록 ===== */
function recordView(){
  const d=draft,sug=d.exercise?suggest(d.exercise):null,recs=S.workouts.filter(w=>w.date===d.date);
  return `<h2 class="title">운동 기록</h2><div class="card">
  <label class="lbl">① 날짜</label><input type="date" class="input" value="${d.date}" max="${todayStr()}" onchange="draft.date=this.value;render()">
  <label class="lbl">② 부위</label><div class="chips">${PARTS.map(p=>`<button class="chip ${d.part===p?'on':''}" data-v="${p}" onclick="pickPart(this.dataset.v)">${p}</button>`).join('')}</div>
  ${d.part?`<label class="lbl">③ 운동</label><div class="chips">${topExercises(d.part,99).map(e=>`<button class="chip ${d.exercise===e?'on':''}" data-v="${esc(e)}" onclick="pickEx(this.dataset.v)">${esc(e)}</button>`).join('')}<button class="chip add" onclick="addEx()">+ 직접 추가</button></div>`:''}
  ${d.exercise?`<label class="lbl">④ 무게 · 횟수</label><div class="hint">💡 ${esc(sug.text)}</div>
    ${d.sets.map((s,i)=>`<div class="setrow"><span class="sn">${i+1}</span>
      <input type="number" inputmode="decimal" class="input num" value="${s.w}" placeholder="맨몸" oninput="draft.sets[${i}].w=this.value"><span>kg</span>
      <input type="number" inputmode="numeric" class="input num" value="${s.r}" placeholder="0" oninput="draft.sets[${i}].r=this.value"><span>회</span>
      <button class="x" onclick="delSet(${i})">✕</button></div>`).join('')}
    <button class="btn ghost" onclick="addSet()">+ 세트 추가 (이전 세트 복사)</button>
    <button class="btn primary" onclick="saveWorkout()">저장하기</button>`:''}</div>
  <h3 class="sec">${fmtDate(d.date)} 기록 ${recs.length?`(${recs.length}종목)`:''}</h3>
  ${recs.length?recs.map(w=>`<div class="card slim"><div class="row between"><b>${esc(w.exercise)} <span class="tag">${w.part}</span></b><button class="x" onclick="delWorkout('${w.id}')">삭제</button></div>
    <div class="muted small">${w.sets.map(s=>`${s.w}kg×${s.r}`).join(' · ')}</div></div>`).join(''):'<p class="muted center">아직 기록이 없어요</p>'}`;
}
function pickPart(p){draft.part=p;draft.exercise=null;draft.sets=[];render()}
function pickEx(e){draft.exercise=e;const l=lastRec(e);draft.sets=l?l.sets.map(s=>({...s})):[{w:'',r:''}];render()}
function addEx(){const n=prompt(`${draft.part} 운동 이름을 입력하세요`)?.trim();if(!n)return;if(!exercisesOf(draft.part).includes(n)){(S.customEx[draft.part]??=[]).push(n);save()}pickEx(n)}
function addSet(){draft.sets.push({...(draft.sets.at(-1)||{w:'',r:''})});render()}
function delSet(i){draft.sets.splice(i,1);if(!draft.sets.length)draft.sets.push({w:'',r:''});render()}
function saveWorkout(){
  if(draft.date>todayStr())return toast('미래 날짜는 기록할 수 없어요');
  const sets=draft.sets.filter(s=>+s.r>0).map(s=>({w:+s.w||0,r:+s.r}));
  if(!sets.length)return toast('횟수를 입력해주세요');
  const ex=S.workouts.find(w=>w.date===draft.date&&w.exercise===draft.exercise);
  const start=ex?ex.sets.length:0;
  if(ex)ex.sets.push(...sets);else S.workouts.push({id:uid(),date:draft.date,part:draft.part,exercise:draft.exercise,sets});
  save();pushSheet('운동기록',sets.map((s,i)=>[draft.date,draft.part,draft.exercise,start+i+1,s.w,s.r,S.user.name]));
  toast('저장됐어요 💪');draft.exercise=null;draft.sets=[];render();
}
function delWorkout(id){if(!confirm('이 기록을 삭제할까요?'))return;S.workouts=S.workouts.filter(w=>w.id!==id);save();render()}

/* ===== 화면: PT ===== */
function ptView(){
  const isT=S.user.role==='trainer',list=S.pt.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return `<h2 class="title">PT ${isT?'· 피드백 작성':'· 트레이너 피드백'}</h2>
  ${isT?`<div class="card"><label class="lbl">수업 날짜</label><input id="pt-date" type="date" class="input" value="${todayStr()}">
    <label class="lbl">회원</label><input id="pt-member" class="input" placeholder="회원 이름">
    <label class="lbl">오늘 수업 내용</label><input id="pt-content" class="input" placeholder="예: 스쿼트 자세 교정, 하체 루틴">
    <label class="lbl">피드백 *</label><textarea id="pt-fb" class="input" rows="3" placeholder="잘한 점 / 고칠 점"></textarea>
    <label class="lbl">다음 수업까지 숙제</label><input id="pt-hw" class="input" placeholder="예: 고블릿 스쿼트 3x12">
    <button class="btn primary" onclick="savePT()">피드백 보내기</button></div><h3 class="sec">작성한 피드백</h3>`:''}
  ${list.length?list.map(ptCard).join(''):'<p class="muted center">아직 PT 기록이 없어요</p>'}`;
}
function ptCard(p){const day=S.workouts.filter(w=>w.date===p.date);
  return `<div class="card ${p.read?'':'new'}"><div class="row between"><b>${fmtDate(p.date)}</b><span class="muted small">${esc(p.trainer)} 트레이너 → ${esc(p.member)}</span></div>
  ${p.content?`<p style="margin-top:8px"><span class="tag">수업</span>${esc(p.content)}</p>`:''}
  <p class="fb">${esc(p.feedback).replace(/\n/g,'<br>')}</p>${p.homework?`<p class="hw">📌 숙제: ${esc(p.homework)}</p>`:''}
  ${day.length?`<details><summary>이날 운동 기록 ${day.length}종목</summary>${day.map(w=>`<div class="small muted">${esc(w.exercise)}: ${w.sets.map(s=>`${s.w}×${s.r}`).join(', ')}</div>`).join('')}</details>`:''}</div>`}
function savePT(){
  const v=id=>$(id).value.trim(),fb=v('#pt-fb');
  if(!v('#pt-member'))return toast('회원 이름을 입력해주세요');if(!fb)return toast('피드백을 입력해주세요');
  const p={id:uid(),date:v('#pt-date'),member:v('#pt-member'),trainer:S.user.name,content:v('#pt-content'),feedback:fb,homework:v('#pt-hw'),read:false};
  S.pt.push(p);save();pushSheet('PT',[[p.date,p.member,p.trainer,p.content,p.feedback,p.homework]]);
  if(S.settings.ptNotify)notify('📝 새 PT 피드백',`${p.member}님에게 피드백이 전송됐어요`);else toast('피드백을 보냈어요');render();
}

/* ===== 화면: 인바디 ===== */
const METRICS=[['weight','체중','kg','#4f46e5'],['muscle','골격근량','kg','#059669'],['fat','체지방률','%','#f59e0b']];
function spark(vals,c){
  if(vals.length<2)return '<div class="muted small">2회 이상 측정하면 그래프가 보여요</div>';
  const W=300,H=60,mn=Math.min(...vals),r=(Math.max(...vals)-mn)||1;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="spark"><polyline points="${vals.map((v,i)=>`${i/(vals.length-1)*W},${H-6-(v-mn)/r*(H-12)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5"/></svg>`}
function inbodyView(){
  const list=S.inbody.slice().sort(byDate);
  return `<h2 class="title">인바디</h2><div class="card"><label class="lbl">측정일</label><input id="ib-date" type="date" class="input" value="${todayStr()}" max="${todayStr()}">
  <div class="grid3">${METRICS.map(([k,l,u])=>`<div><label class="lbl">${l}(${u})</label><input id="ib-${k}" type="number" inputmode="decimal" class="input num" placeholder="0"></div>`).join('')}</div>
  <button class="btn primary" onclick="saveInbody()">등록</button></div>
  ${list.length?`<div class="card">${METRICS.map(([k,l,u,c])=>{const d=(list.at(-1)[k]-list[0][k]).toFixed(1);
    return `<div class="metric"><div class="row between"><b>${l}</b><span>${list.at(-1)[k]}${u} <span class="small ${d>0?'up':'down'}">${d>0?'+':''}${d} (처음 대비)</span></span></div>${spark(list.map(x=>x[k]),c)}</div>`}).join('')}</div>`:''}
  <h3 class="sec">측정 기록</h3>
  ${list.length?list.slice().reverse().map(x=>`<div class="card"><div class="row between"><div><b>${fmtDate(x.date)}</b><div class="muted small">체중 ${x.weight}kg · 골격근 ${x.muscle}kg · 체지방 ${x.fat}%</div></div><button class="x" onclick="delInbody('${x.id}')">삭제</button></div></div>`).join(''):'<p class="muted center">첫 인바디를 등록해보세요</p>'}`;
}
function saveInbody(){
  const date=$('#ib-date').value,o={};for(const [k,l] of METRICS){o[k]=+$('#ib-'+k).value;if(!o[k])return toast(`${l}을(를) 입력해주세요`)}
  S.inbody=S.inbody.filter(x=>x.date!==date);S.inbody.push({id:uid(),date,...o});save();
  pushSheet('인바디',[[date,S.user.name,o.weight,o.muscle,o.fat]]);toast('인바디가 등록됐어요');render();
}
function delInbody(id){if(!confirm('삭제할까요?'))return;S.inbody=S.inbody.filter(x=>x.id!==id);save();render()}

/* ===== 화면: 설정 ===== */
function settingsView(){
  const s=S.settings;
  return `<h2 class="title">설정</h2>
  <div class="card"><div class="row between"><div><b>${esc(S.user.name)}</b><div class="muted small">${S.user.role==='trainer'?'트레이너':'회원'} 계정</div></div><button class="btn sm" onclick="switchRole()">역할 전환(데모)</button></div></div>
  <div class="card"><h3>🏋️ 루틴 방식</h3><div class="chips">${SPLIT_LIST.map(([k,v])=>`<button class="chip ${s.split===k?'on':''}" onclick="setSplit('${k}')">${v}</button>`).join('')}</div><p class="muted small" style="margin-top:10px">${SPLIT_DESC[s.split]}</p></div>
  <div class="card"><h3>🔔 알림</h3>
    <div class="row between"><span>운동 알림</span><input type="checkbox" class="toggle" ${s.notify?'checked':''} onchange="toggleNotify(this.checked)"></div>
    <div class="row between"><span>알림 시간</span><input type="time" class="input w-auto" value="${s.notifyTime}" onchange="S.settings.notifyTime=this.value;save()"></div>
    <div class="row"><div class="chips">${'일월화수목금토'.split('').map((d,i)=>`<button class="chip sm ${s.notifyDays.includes(i)?'on':''}" onclick="toggleDay(${i})">${d}</button>`).join('')}</div></div>
    <div class="row between"><span>PT 피드백 도착 알림</span><input type="checkbox" class="toggle" ${s.ptNotify?'checked':''} onchange="S.settings.ptNotify=this.checked;save()"></div>
    <button class="btn ghost" onclick="testNotify()">알림 테스트</button></div>
  <div class="card"><h3>📊 구글 시트 연결</h3>
    <label class="lbl">Apps Script 웹앱 URL</label><input class="input" id="st-url" value="${esc(s.scriptUrl)}" placeholder="https://script.google.com/macros/s/.../exec">
    <label class="lbl">보안 토큰</label><input class="input" id="st-token" value="${esc(s.token)}" placeholder="Apps Script의 TOKEN 값">
    <div class="row gap"><button class="btn sm" onclick="saveSheet()">저장</button><button class="btn sm" onclick="pullSheet()">시트에서 불러오기</button></div>
    <p class="muted small" style="margin-top:8px">${s.scriptUrl?'✅ 연결됨 · 기록할 때마다 시트에 자동 저장':'연결하지 않으면 이 기기에만 저장돼요'}</p></div>
  <div class="card"><h3>💾 데이터</h3><div class="row gap"><button class="btn sm" onclick="exportCSV()">CSV 내보내기</button><button class="btn sm" onclick="seed();save();render();toast('샘플 데이터를 추가했어요')">샘플 데이터</button><button class="btn sm danger" onclick="resetAll()">초기화</button></div></div>
  <button class="btn" onclick="logout()">로그아웃</button>`;
}
function switchRole(){S.user.role=S.user.role==='trainer'?'member':'trainer';save();render();toast(`${S.user.role==='trainer'?'트레이너':'회원'} 모드로 전환했어요`)}
function toggleNotify(on){if(on&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission();S.settings.notify=on;save();toast(on?`${S.settings.notifyTime}에 알려드릴게요`:'알림을 껐어요')}
function toggleDay(i){const a=S.settings.notifyDays;S.settings.notifyDays=a.includes(i)?a.filter(x=>x!==i):[...a,i];save();render()}
function notify(t,b){if('Notification' in window&&Notification.permission==='granted'){try{new Notification(t,{body:b});return}catch(e){}}toast(`${t} — ${b}`)}
function testNotify(){const r=recommend();notify('💪 운동할 시간이에요!',`${r.label}: ${r.parts.join(', ')}`)}
function checkNotify(){
  const s=S.settings;if(!s.notify||!S.user)return;const n=new Date(),hm=n.toTimeString().slice(0,5),h=n.getHours();
  if(h>=22||h<8||!s.notifyDays.includes(n.getDay())||hm!==s.notifyTime||s.lastNotified===todayStr())return;
  s.lastNotified=todayStr();save();testNotify();
}
function logout(){S.user=null;save();render()}
function resetAll(){if(confirm('이 기기의 모든 데이터를 삭제할까요? (시트 데이터는 유지)')){localStorage.removeItem(KEY);location.reload()}}
function exportCSV(){
  const rows=[['날짜','부위','운동','세트','무게','횟수']];
  S.workouts.slice().sort(byDate).forEach(w=>w.sets.forEach((s,i)=>rows.push([w.date,w.part,w.exercise,i+1,s.w,s.r])));
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='운동기록.csv';a.click();
}

/* ===== 구글 시트 연동 ===== */
function saveSheet(){S.settings.scriptUrl=$('#st-url').value.trim();S.settings.token=$('#st-token').value.trim();save();render();toast('저장했어요')}
async function pushSheet(type,rows){
  const {scriptUrl,token}=S.settings;if(!scriptUrl)return;
  try{await fetch(scriptUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,type,rows})})}
  catch(e){toast('시트 저장 실패 (기기에는 저장됨)')}
}
async function pullSheet(){
  const {scriptUrl,token}=S.settings;if(!scriptUrl)return toast('URL을 먼저 저장해주세요');
  try{toast('불러오는 중...');
    const rows=await (await fetch(`${scriptUrl}?type=${encodeURIComponent('운동기록')}&token=${encodeURIComponent(token)}`)).json();
    if(rows.error)return toast(rows.error);
    const map={};
    rows.forEach(r=>{const date=String(r['날짜']).slice(0,10),part=r['부위'],ex=r['운동'];if(!date||!ex)return;
      const k=date+'|'+ex;map[k]??={id:uid(),date,part,exercise:ex,sets:[]};map[k].sets.push({w:+r['무게']||0,r:+r['횟수']||0});
      if(PARTS.includes(part)&&!exercisesOf(part).includes(ex))(S.customEx[part]??=[]).push(ex)});
    if(!confirm(`시트에서 ${Object.keys(map).length}개 기록을 찾았어요. 이 기기의 기록을 시트 기준으로 바꿀까요?`))return;
    S.workouts=Object.values(map);save();render();toast('동기화 완료!');
  }catch(e){toast('불러오기 실패: URL과 배포 권한을 확인해주세요')}
}

/* ===== 샘플 데이터 ===== */
function seed(){
  const plan=[['가슴','팔'],['등','팔'],['하체','복근'],['어깨']];
  const W={벤치프레스:50,'인클라인 덤벨프레스':16,랫풀다운:45,바벨로우:40,스쿼트:60,레그프레스:120,오버헤드프레스:30,'사이드 레터럴 레이즈':8,바벨컬:20,'케이블 푸시다운':20,크런치:0,'행잉 레그레이즈':0};
  [13,11,9,8,6,4,2].forEach((off,i)=>{const d=new Date();d.setDate(d.getDate()-off);const ds=localDate(d),late=i>=4;
    plan[i%4].forEach(p=>DEFAULT_EX[p].slice(0,2).forEach(ex=>{const w=(W[ex]??20)+(late&&W[ex]?2.5:0);
      S.workouts.push({id:uid(),date:ds,part:p,exercise:ex,sets:[{w,r:late?12:10},{w,r:late?12:10},{w,r:late?12:8}]})}))});
  const dd=n=>{const d=new Date();d.setDate(d.getDate()-n);return localDate(d)};
  S.inbody.push({id:uid(),date:dd(30),weight:74.2,muscle:32.1,fat:21.5},{id:uid(),date:dd(16),weight:73.6,muscle:32.3,fat:20.6},{id:uid(),date:dd(2),weight:73.1,muscle:32.6,fat:19.8});
  S.pt.push({id:uid(),date:dd(4),member:S.user?.name||'회원',trainer:'박코치',content:'등 운동 자세 교정 (랫풀다운, 바벨로우)',feedback:'랫풀다운 할 때 어깨가 으쓱 올라가는 습관이 있어요. 견갑을 먼저 내리고 당기세요!\n바벨로우는 허리 각도가 아주 좋았습니다 👍',homework:'개인 운동 때 랫풀다운 가볍게 4x12, 견갑 하강 의식하기',read:false});
}

/* ===== 렌더링 ===== */
function navView(){const u=unreadPT();
  return `<nav>${[['home','🏠','홈'],['record','✏️','기록'],['pt','💬','PT'],['inbody','📈','인바디'],['settings','⚙️','설정']].map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}${k==='pt'&&u?`<span class="badge">${u}</span>`:''}</button>`).join('')}</nav>`}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  if(!S.user){$('#app').innerHTML=loginView();return}
  const V={home:homeView,record:recordView,pt:ptView,inbody:inbodyView,settings:settingsView};
  $('#app').innerHTML=`<main class="screen">${V[tab]()}</main>${navView()}`;
  if(tab==='pt'&&S.user.role==='member'&&S.pt.some(p=>!p.read)){S.pt.forEach(p=>p.read=true);save()}
}
setInterval(checkNotify,30000);
render();
</script>
</body>
</html>
