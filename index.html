async function boot(){
  const q=new URLSearchParams(location.search+'&'+location.hash.slice(1));let oauthErr=q.get('error_description');
  const fromAuth=/(access_token|code)=/.test(location.search+location.hash);
  if(CONFIG_OK&&q.get('code')&&q.get('state')&&q.get('state')===ssGet('naver_state')){   /* 네이버 로그인에서 돌아옴 */
    ssSet('naver_state',null);
    try{const r=await sb.functions.invoke('naver-auth',{body:{action:'callback',code:q.get('code'),state:q.get('state')}});
      if(r.error)throw new Error(await fnErr(r.error));
      const {error}=await sb.auth.setSession(r.data);if(error)throw error;
    }catch(e){oauthErr=e.message||String(e)}
  }
  if(CONFIG_OK){
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      const pend=ssGet('mm-pending-login');
      if(fromAuth&&pend){lsSet('mm-last-login',pend);lsSet('mm-login-at',Date.now())}   /* 간편 로그인 성공 */
      ssSet('mm-pending-login',null);
      const at=+lsGet('mm-login-at');
      if(!at)lsSet('mm-login-at',Date.now());
      if(at&&Date.now()-at>KEEP_DAYS*864e5){await sb.auth.signOut();lsSet('mm-login-at',null);oauthErr=oauthErr||`로그인 유지 기간(${KEEP_DAYS}일)이 지났어요. 다시 로그인해 주세요`}
      else await run(()=>afterLogin(session.user));
    }
  }
  if(/(access_token|code|error)=/.test(location.search+location.hash))history.replaceState(null,'',location.pathname);
  render();
  if(oauthErr)toast(oauthErr.startsWith('로그인 유지')?oauthErr:'간편 로그인 실패: '+oauthErr.replace(/\+/g,' '));
}
/* 간편 로그인 (Supabase OAuth). 공급자 설정은 Supabase > Authentication > Sign In / Providers */
const appUrl=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
async function fnErr(e){try{const b=await e.context.json();return b.error||e.message}catch(_){return e.message||String(e)}}
async function oauth(provider){await run(async()=>{
  ssSet('mm-pending-login',provider);
  if(provider==='naver'){   /* 네이버는 Edge Function(supabase/functions/naver-auth)으로 처리 */
    const state='nv'+crypto.getRandomValues(new Uint32Array(4)).join('');ssSet('naver_state',state);
    const r=await sb.functions.invoke('naver-auth',{body:{action:'start',state,redirect_uri:appUrl()}});
    if(r.error)throw new Error('네이버 로그인 준비 실패: '+await fnErr(r.error));
    location.href=r.data.url;return;
  }
  const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:appUrl()}});if(error)throw error;
})}

const exercisesOf=p=>[...new Set([...(st.exercises[p]||[]),...st.logs.filter(l=>l.part===p).map(l=>l.exercise)])];
const lastRec=ex=>st.logs.find(l=>l.exercise===ex);
const restDays=p=>{const l=st.logs.find(x=>x.part===p||(x.part==='팔'&&(p==='이두'||p==='삼두')));  /* '팔'은 이전 버전 기록 호환 */
  return l?daysSince(l.log_date):999};
function topExercises(p,n){
  const cnt={};st.logs.filter(l=>l.part===p).forEach(l=>cnt[l.exercise]=(cnt[l.exercise]||0)+1);
  return [...new Set([...Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),...exercisesOf(p)])].slice(0,n);
}
function suggest(ex){
  const tr=TARGET_REPS[planLevel()],last=lastRec(ex);
  if(!last)return{text:'첫 기록이에요! 가벼운 무게로 자세부터 잡아요',w:'',r:tr};
  const sets=last.sets,top=sets.reduce((a,s)=>+s.w>+a.w?s:a,sets[0]);
  let w=+top.w,r=+top.r,msg;
  if(sets.every(s=>+s.r>=tr)){
    if(w>0){w=Math.round((w+(w>=40?2.5:1))*10)/10;r=tr;msg=`전 세트 ${tr}회 달성 → ${w}kg 증량 도전!`}
    else{r=r+1;msg=`전 세트 ${tr}회 달성 → ${r}회로 늘리기`}
  }else{r=r+1;msg=`목표 ${tr}회 미달 → 같은 무게로 ${r}회 도전`}
  return{text:`지난번 ${top.w}kg×${top.r}회 · ${msg}`,w,r};
}
function recommend(){
  const level=curLevel(),pl=planLevel();
  let plan=PLANS[pl];
  if(pl==='초급'&&!st.logs.length)plan=[{label:'전신',parts:['하체','가슴','등']}];
  const pick=plan.map(g=>({...g,rest:Math.min(...g.parts.map(restDays))})).reduce((a,b)=>b.rest>a.rest?b:a);
  const per=pick.parts.length>=3?1:2;
  const items=pick.parts.flatMap(p=>topExercises(p,per).map(ex=>({part:p,ex,...suggest(ex)}))).slice(0,5);
  const warns=pick.parts.map(p=>st.logs.find(l=>l.part===p)).filter(l=>l&&/통증|부상/.test(l.feedback||''));
  return{pick,items,warns,level};
}

function weekStrip(){
  const base=new Date(today()+'T00:00');base.setDate(base.getDate()-(base.getDay()+6)%7+st.week*7);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return localDate(d)});

/* ===== 구글 시트 기록 가져오기 (회원코드로 매핑) ===== */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function parseSheet(text){
  const rows=parseCSV(text.replace(/^\uFEFF/,'')),isH=(c,re)=>re.test((c||'').trim());
  const hi=rows.findIndex(r=>r.some(c=>isH(c,/^(date|날짜)$/i))&&r.some(c=>isH(c,/^(exercise|운동)$/i)));
  if(hi<0)throw new Error('헤더 행(Date, Exercise)을 찾지 못했어요. 운동 기록 탭을 CSV로 내려받았는지 확인해 주세요');
  const H=rows[hi].map(c=>(c||'').trim().toLowerCase()),col=(...n)=>H.findIndex(h=>n.includes(h));
  const cD=col('date','날짜'),cP=col('work','부위'),cE=col('exercise','운동'),cT=col('pt'),cF=col('feedback','피드백'),cN=col('note','노트'),cC=col('member_code','회원코드','회원 코드');
  const W=[],R=[];H.forEach((h,i)=>{let m=h.match(/^w(\d+)$/);if(m)W[+m[1]-1]=i;m=h.match(/^r(\d+)$/);if(m)R[+m[1]-1]=i});
  const out=[];let skipped=0;
  for(const r of rows.slice(hi+1)){
    const date=(r[cD]||'').trim().slice(0,10),ex=(r[cE]||'').trim(),part=cP>=0?(r[cP]||'').trim():'';
    if(!/^\d{4}-\d\d-\d\d$/.test(date)||!ex||!part)continue;
    const sets=[],memo=[];
    for(let i=0;i<R.length;i++){if(R[i]==null)continue;const rp=(r[R[i]]||'').trim();if(!rp)continue;
      const m=rp.match(/\d+(?:\.\d+)?/),w=W[i]!=null?(r[W[i]]||'').trim():'';let wt=0;
      if(/^\d+(?:\.\d+)?\s*(kg)?$/i.test(w))wt=parseFloat(w);else if(w&&w!=='-')memo.push(w);
      sets.push({w:wt,r:m?Math.round(parseFloat(m[0])):0})}
    if(!sets.length){skipped++;continue}
    let fb=cF>=0?(r[cF]||'').replace(/[\x00-\x08]/g,'').trim():'';
    if(memo.length)fb=(fb?fb+' ':'')+'[무게메모: '+memo.join(', ')+']';
    out.push({code:cC>=0?(r[cC]||'').trim().toUpperCase():'',date,part,exercise:ex.slice(0,60),sets,feedback:fb,note:cN>=0?(r[cN]||'').replace(/[\x00-\x08]/g,'').trim():'',is_pt:cT>=0&&/pt/i.test((r[cT]||'').replace(/[\x00-\x08]/g,''))});
  }
  return {recs:out,skipped,hasCode:cC>=0};
}
function impPlan(){
  const I=st.imp,def=($('#imp-code')?.value||I.code||'').trim().toUpperCase(),by={};
  for(const r of I.recs){const code=r.code||def,m=st.members.find(x=>(x.member_code||'').toUpperCase()===code);const k=m?m.id:'x:'+code;(by[k]??={m,code,n:0,from:'9',to:'0'});by[k].n++;by[k].from=r.date<by[k].from?r.date:by[k].from;by[k].to=r.date>by[k].to?r.date:by[k].to}
  return Object.values(by);
}
function pickSheet(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const p=parseSheet(String(rd.result));st.imp={name:f.name,recs:p.recs,skipped:p.skipped,hasCode:p.hasCode,code:st.sel?.member_code||''};if(!p.recs.length)toast('가져올 기록을 찾지 못했어요')}catch(e){st.imp=null;toast(e.message)}render()};
  rd.readAsText(f,'utf-8')}
function impCode(){render()}
function impCancel(){st.imp=null;render()}
const impCard=()=>{const I=st.imp;
  const plan=I?impPlan():[],ok_=plan.filter(p=>p.m),bad=plan.filter(p=>!p.m),n=ok_.reduce((a,p)=>a+p.n,0);
  return `<div class="card"><h3>구글 시트 기록 가져오기</h3>
  <div class="small muted">시트의 운동 기록 탭을 CSV로 내려받아 올리면, 회원코드의 회원 히스토리로 들어가요. CSV에 <b>회원코드</b> 열이 있으면 행마다 그 회원에게, 없으면 아래 코드의 회원에게 모두 들어가요. 같은 기록은 다시 올려도 중복되지 않아요.</div>
  <label class="lbl">회원코드</label><input id="imp-code" class="input" style="font-family:var(--mono);text-transform:uppercase" value="${esc(I?.code??st.sel?.member_code??'')}" placeholder="예) M123456" oninput="st.imp&&(st.imp.code=this.value.trim().toUpperCase(),$('#imp-plan').innerHTML=impPlanHtml())">
  <label class="lbl">CSV 파일</label><input type="file" accept=".csv,text/csv" class="input" style="padding-top:12px" onchange="pickSheet(this)">
  ${I?`<div id="imp-plan">${impPlanHtml()}</div>`:''}</div>`};
function impPlanHtml(){const I=st.imp,plan=impPlan(),ok_=plan.filter(p=>p.m),bad=plan.filter(p=>!p.m),n=ok_.reduce((a,p)=>a+p.n,0);
  return `<div class="fb" style="margin-top:12px"><b>${esc(I.name)}</b> · 기록 ${I.recs.length}건${I.skipped?` (횟수 없는 ${I.skipped}줄 제외)`:''}
  ${ok_.map(p=>`<div style="margin-top:6px">${esc(p.m.name)} <span class="tag">${esc(p.m.member_code)}</span> ${p.n}건 <span class="small muted">${p.from} ~ ${p.to}</span></div>`).join('')}
  ${bad.map(p=>`<div style="margin-top:6px;color:var(--warn)">${p.code?esc(p.code)+' · 내 회원이 아니에요':'회원코드를 입력해 주세요'} · ${p.n}건 건너뜀</div>`).join('')}</div>
  ${n?`<button class="btn primary" onclick="runImport()">${n}건 가져오기</button>`:''}<button class="btn ghost" onclick="impCancel()">취소</button>`}
function runImport(){return run(async()=>{
  const I=st.imp,plan=impPlan().filter(p=>p.m);if(!plan.length)return;
  const def=(I.code||'').toUpperCase();let added=0,dup=0;
  for(const p of plan){
    const existing=await fetchAll(()=>sb.from('workout_logs').select('log_date,exercise,sets').eq('user_id',p.m.id).order('id'));
    const seen=new Set(existing.map(l=>l.log_date+'|'+l.exercise+'|'+JSON.stringify(l.sets)));
    const rows=[];
    for(const r of I.recs){if((r.code||def)!==p.m.member_code.toUpperCase())continue;
      const k=r.date+'|'+r.exercise+'|'+JSON.stringify(r.sets);if(seen.has(k)){dup++;continue}seen.add(k);
      rows.push({user_id:p.m.id,log_date:r.date,part:r.part,exercise:r.exercise,sets:r.sets,feedback:r.feedback,note:r.note,is_pt:r.is_pt,imported:true})}
    for(let i=0;i<rows.length;i+=300){
      const {error}=await sb.from('workout_logs').insert(rows.slice(i,i+300));
      if(error)throw new Error(/imported/.test(error.message)?'DB 업데이트가 필요해요 (supabase/migration_006_sheet_import.sql 실행)':error.message)}
    added+=rows.length;
    /* 시트에만 있던 종목은 종목 목록에도 추가 */
    const names=[...new Map(rows.filter(r=>PARTS.includes(r.part)).map(r=>[r.part+'|'+r.exercise,{body_part:r.part,name:r.exercise}])).values()].filter(x=>!(st.exercises[x.body_part]||[]).includes(x.name));
    if(names.length){try{ok(await sb.from('exercises').upsert(names,{onConflict:'body_part,name',ignoreDuplicates:true}));names.forEach(x=>(st.exercises[x.body_part]??=[]).push(x.name))}catch(e){console.warn(e)}}
  }
  st.imp=null;await loadData();render();toast(`${added}건을 가져왔어요${dup?` · 이미 있는 ${dup}건은 건너뜀`:''}`);
})}
function searchMember(){return run(async()=>{
  const q=$('#m-q').value.trim();if(!q)return toast('이름, 회원코드 또는 이메일을 입력해주세요');
  const r=await sb.rpc('search_members',{q});
  if(r.error){   /* migration_005 전: 이메일 정확히 일치만 */
    const one=ok(await sb.from('profiles').select('id,name,email,level,trainer_id').eq('role','member').eq('email',q.toLowerCase()).maybeSingle());
    st.found=one?[{...one,email_hint:one.email,trainer_state:one.trainer_id===st.me.id?'mine':one.trainer_id?'other':'none'}]:[];
  }else st.found=r.data;
  render();$('#m-q').value=q;
})}
function addManaged(){return run(async()=>{
  const name=$('#mm-name').value.trim();if(!name)return toast('이름을 입력해주세요');
  const m=ok(await sb.rpc('create_managed_member',{p_name:name,p_level:'초급'}));
  st.sel={id:m.id};st.found=undefined;await loadData();render();toast(`${m.name} 회원을 등록했어요 · 회원코드 ${m.member_code}`);
})}
function addMember(id){return run(async()=>{
  ok(await sb.from('profiles').update({trainer_id:st.me.id}).eq('id',id).select());
  st.found=undefined;st.sel={id};await loadData();render();toast('담당 회원으로 등록했어요');
})}
function saveNotes(){return run(async()=>{
  const notes=$('#m-notes').value,curriculum=$('#m-cur').value;
  if(st.notesTable)ok(await sb.from('member_notes').upsert({member_id:st.sel.id,trainer_id:st.me.id,notes,curriculum,updated_at:new Date().toISOString()},{onConflict:'member_id,trainer_id'}));
  else ok(await sb.from('profiles').update({notes,curriculum}).eq('id',st.sel.id).select());
  await loadData();render();toast('저장했어요');
})}

const addDays=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return localDate(x)};
const weekStart=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return localDate(x)};
const shortD=d=>`${+d.slice(5,7)}월 ${+d.slice(8)}일`;
function ptView(){
  const mode=st.ptMode,d=st.ptDate||today(),from=mode==='day'?d:weekStart(d),to=mode==='day'?d:addDays(from,6);
  const nameOf=id=>st.members.find(m=>m.id===id)?.name||'회원',codeOf=id=>st.members.find(m=>m.id===id)?.member_code||'';
  const list=st.trainerPT.filter(p=>p.pt_date>=from&&p.pt_date<=to&&p.status!=='canceled'),canceled=st.trainerPT.filter(p=>p.pt_date>=from&&p.pt_date<=to&&p.status==='canceled');
  const title=mode==='day'?`${fmtDate(d)}${d===today()?' · 오늘':''}`:`${shortD(from)} ~ ${shortD(to)}${from===weekStart(today())?' · 이번 주':''}`;
  const dayCard=p=>`<div class="card"><div class="row between"><div><b style="font-size:18px">${esc((p.pt_time||'').slice(0,5))}</b> <b>${esc(nameOf(p.member_id))}</b> <span class="small muted">${esc(codeOf(p.member_id))}</span></div>${ptTag(p)}</div>
    <div class="small muted" style="margin-top:6px">${esc(p.goal)||'목표 미입력'}</div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn sm primary" onclick="openPT('${p.member_id}')">수업 기록하기</button>
    <select class="input" style="width:auto;min-height:40px;padding:6px 10px" aria-label="상태" onchange="setPT('${p.id}',this.value)">${Object.entries(PT_STATUS).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
    ${p.status==='requested'?`<div class="row" style="margin-top:10px"><button class="btn sm primary" onclick="setPT('${p.id}','scheduled')">승인</button><button class="btn sm" onclick="setPT('${p.id}','canceled')">거절</button></div>`:''}</div>`;
  let body;
  if(mode==='day')body=list.length?list.map(dayCard).join(''):`<div class="card center muted">이 날은 PT 일정이 없어요.</div>`;
  else{const days=[...Array(7)].map((_,i)=>addDays(from,i));
    body=days.map(x=>{const ps=list.filter(p=>p.pt_date===x);return `<div class="date" style="display:flex;justify-content:space-between"><span>${fmtDate(x)}${x===today()?' · 오늘':''}</span><span>${ps.length?ps.length+'건':''}</span></div>
      ${ps.length?`<div class="card" style="padding:4px 16px">${ps.map(p=>`<button class="item" style="width:100%;background:none;border:none;border-top:1px solid var(--line);color:inherit;font-family:inherit;font-size:inherit;text-align:left;cursor:pointer" onclick="ptDay('${x}')"><div><b>${esc((p.pt_time||'').slice(0,5))}</b> ${esc(nameOf(p.member_id))}<div class="small muted">${esc(p.goal)}</div></div>${ptTag(p)}</button>`).join('')}</div>`:''}`}).join('')}
  return `<h2>PT 일정</h2>
  <button class="btn primary" style="margin-top:0" onclick="ptOpenForm()">+ PT 일정 등록</button>
  <div class="seg"><button class="${mode==='day'?'on':''}" onclick="ptSetMode('day')">일</button><button class="${mode==='week'?'on':''}" onclick="ptSetMode('week')">주</button></div>
  <div data-swipe="pt"><div class="row between" style="margin:12px 0 4px">${navBtn('ptNav(-1)',mode==='day'?'이전 날':'이전 주',-1)}<div style="text-align:center"><b>${title}</b><div class="small muted">${list.length}건${canceled.length?` · 취소 ${canceled.length}건`:''}</div></div>${navBtn('ptNav(1)',mode==='day'?'다음 날':'다음 주',1)}</div>
  ${d!==today()&&mode==='day'||mode==='week'&&from!==weekStart(today())?`<button class="chip" style="margin:8px 0" onclick="ptToday()">오늘로</button>`:''}
  <div class="small muted" style="margin:4px 0;text-align:center">옆으로 밀어서 ${mode==='day'?'날짜':'주'} 이동</div>
  ${body}</div>${st.ptf?ptSheet():''}`;
}
function ptSetMode(m){st.ptMode=m;render()}

function addPT(){return run(async()=>{

/* ===== 인바디 ===== */
function spark(vals,color){
  const v=vals.filter(x=>x!=null&&!isNaN(x));if(v.length<2)return '<div class="small muted" style="padding:10px 0">기록이 2개 이상이면 그래프가 보여요</div>';
  const mn=Math.min(...v),mx=Math.max(...v),W=300,H=64,p=6,sx=(W-2*p)/(v.length-1),sy=y=>H-p-(mx===mn?.5:(y-mn)/(mx-mn))*(H-2*p);
  const pts=v.map((y,i)=>[(p+i*sx).toFixed(1),sy(y).toFixed(1)]);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:64px;margin-top:6px"><polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${pts.map(x=>x.join(',')).join(' ')}"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="4" fill="${color}"/></svg>`;
}
const dlt=(a,b)=>{if(a==null||b==null)return '-';const d=Math.round((a-b)*10)/10;return d>0?`+${d}`:`${d}`};
function inbodyView(){
  if(coaching()&&!st.sel)return `<h2>인바디</h2>${noMember()}`;
  const rec=st.inbody,asc=[...rec].reverse(),num=x=>x==null?null:+x,h=+(targetProfile()?.height_cm||0);
  const lastOf=k=>rec.find(r=>r[k]!=null),firstOf=k=>asc.find(r=>r[k]!=null),prevOf=k=>rec.filter(r=>r[k]!=null)[1];
  const bmi=w=>h&&w?` · BMI ${(w/((h/100)**2)).toFixed(1)}`:'';
  const f1=x=>x==null?'-':x;
  return `<h2>${coaching()?`${esc(st.sel.name)} 회원 인바디`:'인바디'}</h2>${coaching()?memberSelect():''}${st.needMig?migHint():''}
  <div class="card"><h3>인바디 기록하기</h3><label class="lbl">측정일</label><input id="ib-date" type="date" class="input" value="${today()}">
  <div class="grid2"><div><label class="lbl">체중 (kg)</label><input id="ib-weight" type="number" inputmode="decimal" step="0.1" class="input"></div><div><label class="lbl">골격근량 (kg)</label><input id="ib-muscle" type="number" inputmode="decimal" step="0.1" class="input"></div></div>
  <div class="grid2"><div><label class="lbl">체지방량 (kg)</label><input id="ib-fat_mass" type="number" inputmode="decimal" step="0.1" class="input"></div><div><label class="lbl">내장지방 레벨</label><input id="ib-visceral_fat" type="number" inputmode="numeric" class="input"></div></div>
  <div class="small muted" style="margin-top:10px">체중만 재도 괜찮아요. 체지방률은 체중과 체지방량으로 자동 계산돼요.</div>
  <button class="btn primary" onclick="saveInbody()">저장하기</button></div>
  ${rec.length?IB.map(([k,l,u,c])=>{const L=lastOf(k);if(!L)return '';const P=prevOf(k),F=firstOf(k);
    return `<div class="card"><div class="metric"><div><div class="small muted">${l} · ${fmtShort(L.measured_on)}</div><b>${num(L[k])}<span class="small muted"> ${u}${k==='weight'?bmi(num(L[k])):''}</span></b></div><div class="small muted">지난번 대비 ${dlt(num(L[k]),P?num(P[k]):null)}<br>처음 대비 ${dlt(num(L[k]),num(F[k]))}</div></div>${spark(asc.map(r=>num(r[k])),c)}</div>`}).join('')
  +`<div class="card" style="padding:8px 10px"><div class="row between" style="padding:6px 4px"><b>측정 기록 ${rec.length}건</b><button class="chip ${st.hf.edit?'on':''}" style="min-height:36px" onclick="hfEdit()">삭제 모드 ${st.hf.edit?'ON':'OFF'}</button></div>
  <table class="tbl" style="font-size:12px"><thead><tr><th>날짜</th><th>체중</th><th>골격근</th><th>체지방</th><th>체지방률</th><th>내장</th>${st.hf.edit?'<th></th>':''}</tr></thead><tbody>${rec.map(r=>`<tr><td class="d">${fmtShort(r.measured_on)}</td><td>${f1(r.weight)}</td><td>${f1(r.muscle)}</td><td>${f1(r.fat_mass)}</td><td>${r.fat_pct!=null?r.fat_pct+'%':'-'}</td><td>${f1(r.visceral_fat)}</td>${st.hf.edit?`<td><button class="btn sm danger" onclick="delInbody('${r.id}')">삭제</button></td>`:''}</tr>`).join('')}</tbody></table></div>`
  :'<div class="card center muted">아직 인바디 기록이 없어요</div>'}`;
}
function saveInbody(){return run(async()=>{
  const tid=targetId();if(!tid)return toast('회원을 먼저 선택해주세요');
  const v=k=>{const x=$('#ib-'+k).value;return x===''?null:+x};
  const row={user_id:tid,measured_on:$('#ib-date').value||today(),weight:v('weight'),muscle:v('muscle')};
  const fm=v('fat_mass'),vf=v('visceral_fat');
  if(fm!=null){row.fat_mass=fm;if(row.weight)row.fat_pct=Math.round(fm/row.weight*1000)/10}
  if(vf!=null)row.visceral_fat=vf;
  if(row.weight==null&&row.muscle==null&&fm==null&&vf==null)return toast('값을 하나 이상 입력해주세요');
  ok(await sb.from('inbody_records').insert(row));await loadData();render();toast('인바디를 저장했어요');
})}
function delInbody(id){const r=st.inbody.find(x=>x.id===id);if(!confirm(`${r?fmtDate(r.measured_on)+' ':''}인바디 기록을 삭제할까요? 되돌릴 수 없어요.`))return;run(async()=>{ok(await sb.from('inbody_records').delete().eq('id',id));await loadData();render()})}

  return `<div class="card"><div class="row between"><div><div class="small muted">운동 등급 · 기록으로 자동 부여</div><b style="font-size:20px">${lv}</b></div><div class="small muted" style="text-align:right">운동한 날 ${days}일<br>운동 기간 ${span}일</div></div>

}

function withdraw(){return run(async()=>{
  if(!$('#wd-ok').checked)return toast('확인 항목에 체크해 주세요');
  const r=await sb.rpc('delete_my_account');
  if(r.error)throw new Error(/function|schema cache/i.test(r.error.message)?'탈퇴 기능은 DB 업데이트(migration_007) 후 쓸 수 있어요':r.error.message);
  lsSet('mm-last-login',null);await logout();toast('탈퇴가 완료됐어요. 그동안 함께해서 고마웠어요.');
})}
function trainerCard(t){
  const row=(l,v)=>v?`<label class="lbl">${l}</label><div class="pre">${esc(v)}</div>`:'';
  return `<div class="card"><div class="row"><div class="avatar">${esc((t.name||'?').slice(0,1))}</div><div><div class="small muted">담당 트레이너</div><b style="font-size:18px">${esc(t.name)}</b>${t.center_name?`<div class="small muted">${esc(t.center_name)}</div>`:''}</div></div>
  ${row('경력',t.career)}${row('전문 분야',t.specialty)}${row('소개',t.bio)}
  <button class="btn ghost" onclick="unlinkTrainer()">연결 해제</button></div>`;
}
function saveMe(){return run(async()=>{
  const num=id=>{const v=$(id).value;return v===''?null:+v},name=$('#p-name').value.trim();
  if(!name)return toast('이름을 입력해주세요');
  const tr=isTrainer();
  const upd={name,...(tr?{center_name:$('#p-center').value.trim(),career:$('#p-career').value.trim(),specialty:$('#p-spec').value.trim(),bio:$('#p-bio').value.trim()}:{}),goal:$('#p-goal').value,height_cm:num('#p-height'),start_weight:num('#p-sw'),birth_date:$('#p-birth').value||null,gender:$('#p-gender').value};
  st.me=ok(await sb.from('profiles').update(upd).eq('id',st.me.id).select().single());render();toast('저장했어요');
})}
function linkTrainer(){return run(async()=>{
  const code=$('#tcode').value.trim();if(!/^\d{4}$/.test(code))return toast('4자리 숫자 코드를 입력해주세요');
  const name=ok(await sb.rpc('link_trainer',{code}));await loadData();render();toast(`${name} 트레이너와 연결됐어요`);
})}
function unlinkTrainer(){if(!confirm('강사 연결을 해제할까요? 트레이너가 더 이상 내 기록을 볼 수 없어요.'))return;run(async()=>{ok(await sb.rpc('unlink_trainer'));await loadData();render();toast('연결을 해제했어요')})}
function copyCode(){navigator.clipboard?.writeText(st.myCode).then(()=>toast('코드를 복사했어요'),()=>toast(st.myCode))}

/* ===== 렌더링 ===== */
function render(){
  const app=$('#app');
  if(!st.me){app.innerHTML=authView();return}
  if(st.me.onboarded===false){st.ob??={role:'member'};app.innerHTML=onboardView();if(st.ob.keep!=null){$('#o-name').value=st.ob.keep;delete st.ob.keep}return}
  if('terms_agreed_at' in st.me&&!st.me.terms_agreed_at){app.innerHTML=termsView();return}   /* migration_007 이후, 동의 기록이 없는 기존 회원 */
  const V={home:()=>coaching()?trainerHomeView():homeView(),record:recordView,history:historyView,members:membersView,pt:ptView,inbody:inbodyView,class:classView,my:myView};
  if(!navTab())st.tab=tabList()[0][0];
  app.innerHTML=headerView()+`<main><div class="eyebrow">${EYEBROW[st.tab]||''}</div>${V[st.tab]()}</main>`+navView()+(st.wd?withdrawSheet():'');
}
boot();
</script>
</body>
</html>
